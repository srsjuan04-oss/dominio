px;margin:0 auto;display:flex;flex-wrap:wrap-reverse;gap:44px;align-items:center\">\n      <div style=\"flex:1 1 380px;min-width:280px;display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(28px,4vw,44px);margin:0\">No se trata solamente de durar m\u00e1s.<\/h2>\n        <h3 style=\"font-family:Sora,sans-serif;font-weight:600;font-size:clamp(22px,3vw,30px);margin:0;color:#6FA8FF\">Se trata de recuperar el control.<\/h3>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.6;color:#A8B6CC\">\n          <p style=\"margin:0\">Porque probablemente no quieres convertirte en una \u201cm\u00e1quina\u201d.<\/p>\n          <p style=\"margin:0\">No est\u00e1s buscando demostrarle nada a nadie.<\/p>\n          <p style=\"margin:0\">Quieres volver a sentir:<\/p>\n        <\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <span style=\"font-family:Sora,sans-serif;font-size:20px;color:#fff;border-bottom:2px solid rgba(43,123,238,.6);padding-bottom:4px\">seguridad.<\/span>\n          <span style=\"font-family:Sora,sans-serif;font-size:20px;color:#fff;border-bottom:2px solid rgba(43,123,238,.6);padding-bottom:4px\">tranquilidad.<\/span>\n          <span style=\"font-family:Sora,sans-serif;font-size:20px;color:#fff;border-bottom:2px solid rgba(43,123,238,.6);padding-bottom:4px\">confianza.<\/span>\n          <span style=\"font-family:Sora,sans-serif;font-size:20px;color:#fff;border-bottom:2px solid rgba(43,123,238,.6);padding-bottom:4px\">control.<\/span>\n        <\/div>\n        <p style=\"margin:8px 0 0;font-size:18px;color:#A8B6CC\">Y disfrutar la intimidad sin entrar pensando:<\/p>\n        <h3 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(22px,3.2vw,32px);margin:0\">\u201c\u00bfQu\u00e9 va a pasar esta vez?\u201d<\/h3>\n      <\/div>\n      <div style=\"flex:1 1 320px;min-width:260px;max-width:420px;margin:0 auto\">\n        <img src=\"2fa9c5c9-e142-456e-9dac-160a105903a5\" alt=\"Pareja feliz abraz\u00e1ndose, cercan\u00eda y confianza recuperada\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.45)\">\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:88px 24px;background:#0E1B2F\">\n    <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:44px;align-items:center\">\n      <div style=\"flex:1 1 300px;min-width:240px;max-width:380px;margin:0 auto\">\n        <img src=\"cb86d43e-e5fd-4451-8298-826922ea3409\" alt=\"Retrato del creador de DOMINIO, mirando hacia adelante con calma\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.45)\">\n      <\/div>\n      <div style=\"flex:1 1 400px;min-width:280px;display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-family:Sora,sans-serif;font-size:13px;letter-spacing:.2em;color:#6FA8FF\">HISTORIA DEL CREADOR<\/span>\n        <h2 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,40px);line-height:1.2;margin:0;text-wrap:pretty\">DOMINIO naci\u00f3 porque su creador tambi\u00e9n estuvo de este lado.<\/h2>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.6;color:#A8B6CC\">\n          <p style=\"margin:0\">Hubo un momento en el que comenz\u00f3 a sentir que su desempe\u00f1o \u00edntimo no era el que quer\u00eda.<\/p>\n          <p style=\"margin:0\">Al principio trat\u00f3 de ignorarlo.<\/p>\n          <p style=\"margin:0\">Despu\u00e9s intent\u00f3 controlarlo.<\/p>\n          <p style=\"margin:0\">Busc\u00f3 soluciones.<\/p>\n          <p style=\"margin:0\">Intent\u00f3 \u201caguantar\u201d.<\/p>\n          <p style=\"margin:0\">Pero el problema empez\u00f3 a afectar algo m\u00e1s que la intimidad.<\/p>\n          <p style=\"margin:0\">Empez\u00f3 a afectar c\u00f3mo se sent\u00eda consigo mismo.<\/p>\n          <p style=\"margin:0\">Se sent\u00eda:<\/p>\n        <\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 16px;font-size:15px;color:#8EA0B9\">triste.<\/span>\n          <span style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 16px;font-size:15px;color:#8EA0B9\">inseguro.<\/span>\n          <span style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 16px;font-size:15px;color:#8EA0B9\">frustrado.<\/span>\n          <span style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 16px;font-size:15px;color:#8EA0B9\">aburrido.<\/span>\n          <span style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 16px;font-size:15px;color:#8EA0B9\">insatisfecho.<\/span>\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.6;color:#A8B6CC\">\n          <p style=\"margin:0\">Y sobre todo, preocupado porque no quer\u00eda que aquella situaci\u00f3n terminara afectando la relaci\u00f3n con su esposa.<\/p>\n          <p style=\"margin:0\">Entonces cambi\u00f3 la pregunta.<\/p>\n          <p style=\"margin:0\">Dej\u00f3 de preguntarse:<\/p>\n        <\/div>\n        <h3 style=\"font-family:Sora,sans-serif;font-weight:600;font-size:clamp(20px,2.6vw,26px);margin:0;color:#8EA0B9;text-decoration:line-through\">\u201c\u00bfC\u00f3mo puedo aguantar m\u00e1s?\u201d<\/h3>\n        <p style=\"margin:0;font-size:18px;color:#A8B6CC\">Y comenz\u00f3 a preguntarse:<\/p>\n        <h3 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(20px,2.8vw,30px);margin:0;color:#fff\">\u201c\u00bfQu\u00e9 puedo aprender a entrenar para tener mayor control?\u201d<\/h3>\n        <p style=\"margin:0;font-size:18px;color:#A8B6CC\">Esa pregunta termin\u00f3 dando origen a:<\/p>\n        <p style=\"font-family:Sora,sans-serif;font-weight:800;font-size:clamp(34px,6vw,64px);margin:0;letter-spacing:.1em;color:#6FA8FF\">DOMINIO.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:88px 24px;background:#F5F7FB;color:#0B1526\">\n    <div style=\"max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px\">\n      <h2 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(28px,4vw,44px);margin:0\">Encontrar informaci\u00f3n es f\u00e1cil.<\/h2>\n      <p style=\"margin:0;font-size:19px;color:#3B4A61\">El problema es saber qu\u00e9 informaci\u00f3n seguir.<\/p>\n      <p style=\"margin:0;font-size:17px;color:#3B4A61\">Internet est\u00e1 lleno de:<\/p>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">videos;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">t\u00e9cnicas;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">respiraciones;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">trucos;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">consejos;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">ejercicios;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">productos;<\/span>\n        <span style=\"background:#fff;border:1px solid #E2E8F2;border-radius:999px;padding:9px 16px;font-size:15px;color:#5A6B85\">soluciones milagrosas.<\/span>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-size:18px;line-height:1.6;color:#3B4A61\">\n        <p style=\"margin:0\">Uno dice una cosa.<\/p>\n        <p style=\"margin:0\">Otro dice lo contrario.<\/p>\n        <p style=\"margin:0\">Y terminas con veinte pesta\u00f1as abiertas...<\/p>\n        <p style=\"margin:0\">pero sin un plan.<\/p>\n      <\/div>\n      <p style=\"margin:0;font-family:Sora,sans-serif;font-size:clamp(20px,2.6vw,26px);color:#0B1526\">DOMINIO fue dise\u00f1ado para eliminar esa confusi\u00f3n.<\/p>\n    <\/div>\n  <\/section>\n\n  <section style=\"padding:92px 24px;background:#0B1526\">\n    <div style=\"max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px\">\n      <h2 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,40px);margin:0\">Lo que probablemente est\u00e1s pensando ahora<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n        <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-size:15px;color:#6FA8FF;font-family:Sora,sans-serif\">\u201cNO TENGO TIEMPO\u201d<\/p>\n          <h3 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:24px;margin:0\">Perfecto.<\/h3>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.55;color:#A8B6CC\">\n            <p style=\"margin:0\">Por eso DOMINIO no requiere una hora.<\/p>\n            <p style=\"margin:0\">Ni treinta minutos.<\/p>\n            <p style=\"margin:0\">Ni veinte.<\/p>\n          <\/div>\n          <p style=\"margin:0;font-family:Sora,sans-serif;font-size:20px;color:#fff\">Aproximadamente 5 minutos al d\u00eda.<\/p>\n          <p style=\"margin:0;font-size:16px;color:#A8B6CC\">Puedes hacerlo:<\/p>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:16px;color:#D6E1F1\">\n            <p style=\"margin:0\">al despertar;<\/p>\n            <p style=\"margin:0\">antes de ducharte;<\/p>\n            <p style=\"margin:0\">despu\u00e9s de entrenar;<\/p>\n            <p style=\"margin:0\">antes de dormir;<\/p>\n            <p style=\"margin:0\">o cuando tengas un momento privado.<\/p>\n          <\/div>\n        <\/div>\n        <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-size:15px;color:#6FA8FF;font-family:Sora,sans-serif\">\u201cYA ESTOY MUY VIEJO\u201d<\/p>\n          <h3 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:22px;margin:0;line-height:1.25\">Esto no se trata de volver a tener 20 a\u00f1os.<\/h3>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.55;color:#A8B6CC\">\n            <p style=\"margin:0\">Se trata de trabajar con el cuerpo que tienes hoy.<\/p>\n            <p style=\"margin:0\">Conocerlo.<\/p>\n            <p style=\"margin:0\">Entrenarlo.<\/p>\n            <p style=\"margin:0\">Cuidarlo.<\/p>\n            <p style=\"margin:0\">Y dejar de asumir autom\u00e1ticamente que cualquier cambio significa que debes resignarte.<\/p>\n          <\/div>\n        <\/div>\n        <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-size:15px;color:#6FA8FF;font-family:Sora,sans-serif\">\u201cYO ENTRENO Y COMO BIEN\u201d<\/p>\n          <h3 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:22px;margin:0;line-height:1.25\">Estar en forma no significa haber entrenado todo.<\/h3>\n
